<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ghana DataHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Ghana DataHub</div>
        <a href="signup.html"><div class="sign">
           <button class="in">Create Account</button> </div></a>
    </header>

    <div class="container">
        <div class="form-card">
            <h2>User Login</h2>
            <!-- Form Action redirects to home.html on submit -->
            <form action="home.html" method="GET">
                <div class="form-group">
                    <label for="phone">Phone Number / Username</label>
                    <input type="text" id="phone" placeholder="e.g., 024XXXXXXX" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div><p></p><div class="sub">
                <button type="submit" class="btn">Login</button>
            </form>

  </div><p></p>
                <div class="my-own">
                <p></p><a href="forgot-password.html" class="forget">
                    Forgot Password
                </a><p></p>
                </div>

        </div>
        
    </div>

    <footer>
        <p>&copy; 2026 Ghana DataHub. All rights reserved.</p>
    </footer>

</body>
</html>
