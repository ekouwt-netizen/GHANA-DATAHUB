<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Ghana Datahub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-header">
      <h2>Forgot Password?</h2>
      <p>Enter your registered phone number or email to receive reset instructions.</p>
    </div>

    <div id="reset-alert" class="alert-message"></div>

    <form id="forgot-form">
      <div class="form-group">
        <label for="recovery-input">Phone Number or Email</label>
        <input type="text" id="recovery-input" placeholder="024XXXXXXX or name@example.com" required>
      </div>

      <button type="submit" class="btn-submit">Send Reset Link / OTP</button>
    </form>

    <div class="auth-footer">
      <p>Remembered your password? <a href="index.html">Back to Login</a></p>
    </div>
  </div>

  <script>
    document.getElementById('forgot-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const inputVal = document.getElementById('recovery-input').value.trim();
      const alertBox = document.getElementById('reset-alert');

      if (inputVal === '') {
        alertBox.className = 'alert-message alert-error';
        alertBox.innerText = 'Please enter your phone number or email address.';
        alertBox.style.display = 'block';
        return;
      }

      // Simulated OTP / Email trigger action
      alertBox.className = 'alert-message alert-success';
      alertBox.innerText = 'Reset instructions have been sent to ' + inputVal + '.';
      alertBox.style.display = 'block';
      
      document.getElementById('recovery-input').value = '';
    });
  </script>

</body>
</html>
